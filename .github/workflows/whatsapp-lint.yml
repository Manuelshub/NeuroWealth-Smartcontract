name: WhatsApp Bot Lint

on:
  pull_request:
    paths:
      - 'whatsapp/**'
      - '.github/workflows/whatsapp-lint.yml'
  push:
    branches:
      - main
      - develop
    paths:
      - 'whatsapp/**'
      - '.github/workflows/whatsapp-lint.yml'

jobs:
  lint:
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./whatsapp

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './whatsapp/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: ESLint
        run: npm run lint

      - name: Build
        run: npm run build
